name: 功能建议 / Feature Request
description: 提议插件的新功能或改进方向
title: "[建议]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature Request 是推荐的前置讨论入口，但不是范围明确的小型功能 PR 的强制条件。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景或问题
      description: 希望解决什么限制、问题或使用场景？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述期望的功能或行为。
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 验收标准 / Acceptance Criteria
      description: 请列出可观察、可测试的完成条件。
      placeholder: |
        - [ ] 当……时，应……
        - [ ] 现有兼容行为保持不变。
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: 非目标 / Non-goals
      description: 说明本提议明确不解决或不改变的内容；没有额外排除项时请写“无”。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 请描述尝试过的临时方案或其他设计；没有时请写“无”。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可添加示例或截图，请先移除其中的敏感信息。
