version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      # Dependabot assigns an update to the first matching group.
      vitest-toolchain:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      openclaw-sdk:
        applies-to: version-updates
        patterns:
          - "openclaw"
        update-types:
          - minor
          - patch
      production-maintenance:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      development-maintenance:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "openclaw"
          - "vitest"
          - "@vitest/*"
        update-types:
          - minor
          - patch
      development-security:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
