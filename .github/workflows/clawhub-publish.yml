name: ClawHub Publish

on:
  pull_request:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    name: Build and dry-run ClawPack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Build ClawPack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-package" "$RUNNER_TEMP/clawhub-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/source-package" >/dev/null
          node scripts/prepare-clawhub-package.mjs \
            "$RUNNER_TEMP/source-package" \
            "$RUNNER_TEMP/clawhub-package"

      - name: Validate and dry-run ClawHub publish
        run: bash scripts/validate-clawhub-package.sh

      - name: Upload ClawPack
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clawhub-package
          path: ${{ runner.temp }}/clawhub-package/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Upload dry-run reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clawhub-dry-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/clawhub-inspector
            ${{ runner.temp }}/clawhub-validate.json
            ${{ runner.temp }}/clawhub-dry-run.json
          if-no-files-found: ignore
          retention-days: 7
