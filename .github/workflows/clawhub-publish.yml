name: ClawHub Publish

on:
  pull_request:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    name: Build and dry-run ClawPack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Inspect canonical npm package
        run: npm run pack:check

      - name: Build ClawPack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-package" "$RUNNER_TEMP/clawhub-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package" >/dev/null
          node scripts/prepare-clawhub-package.mjs \
            "$RUNNER_TEMP/npm-package" \
            "$RUNNER_TEMP/clawhub-package"

      - name: Validate and dry-run ClawHub publish
        run: |
          set -euo pipefail
          shopt -s nullglob
          clawpacks=("$RUNNER_TEMP/clawhub-package/"*.tgz)
          if (( ${#clawpacks[@]} != 1 )); then
            echo "::error::Expected exactly one ClawPack, found ${#clawpacks[@]}."
            exit 1
          fi
          clawpack="${clawpacks[0]}"
          openclaw_version="$(
            node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).openclaw.build.openclawVersion"
          )"
          package_root="$RUNNER_TEMP/clawhub-package-root"
          mkdir -p "$package_root"
          tar -xzf "$clawpack" -C "$package_root"
          npx --yes clawhub@0.23.3 package validate \
            "$package_root/package" \
            --out "$RUNNER_TEMP/clawhub-inspector" \
            --openclaw-version "$openclaw_version" \
            --json |
            tee "$RUNNER_TEMP/clawhub-validate.json"
          npx --yes clawhub@0.23.3 package publish "$clawpack" \
            --family code-plugin \
            --owner newfuture \
            --display-name WeChat \
            --categories channels \
            --topics wechat,weixin,messaging \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --dry-run \
            --json |
            tee "$RUNNER_TEMP/clawhub-dry-run.json"

      - name: Upload ClawPack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clawhub-package
          path: ${{ runner.temp }}/clawhub-package/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Upload dry-run reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clawhub-dry-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/clawhub-inspector
            ${{ runner.temp }}/clawhub-validate.json
            ${{ runner.temp }}/clawhub-dry-run.json
          if-no-files-found: ignore
          retention-days: 7
