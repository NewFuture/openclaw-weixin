name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate npm release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify release metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a tag, not ${RELEASE_REF_TYPE} ${RELEASE_TAG}."
            exit 1
          fi
          npm run check:versions
          transition_output="$(mktemp)"
          trap 'rm -f "$transition_output"' EXIT
          GITHUB_OUTPUT="$transition_output" node scripts/resolve-release-transition.mjs
          release_commit="$(grep '^release_commit=' "$transition_output" | cut -d= -f2)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves release commit ${release_commit}, but this run is on ${GITHUB_SHA}. Only the CI coordinator may trigger a release publish; do not push tags manually."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Check project
        run: npm run check

      - name: Inspect package contents
        run: npm run pack:check

      - name: Verify npm release order
        run: |
          registry_error="$(mktemp)"
          trap 'rm -f "$registry_error"' EXIT
          if ! latest_version="$(
            npm view "openclaw-weixin@latest" version \
              --registry=https://registry.npmjs.org 2>"$registry_error"
          )"; then
            cat "$registry_error" >&2
            echo "::error::Could not read the npm latest version."
            exit 1
          fi
          RELEASE_PREVIOUS_VERSION="$latest_version" npm run check:versions

  publish:
    name: Approve and publish to npm
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/openclaw-weixin
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify release metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a tag, not ${RELEASE_REF_TYPE} ${RELEASE_TAG}."
            exit 1
          fi
          npm run check:versions
          transition_output="$(mktemp)"
          trap 'rm -f "$transition_output"' EXIT
          GITHUB_OUTPUT="$transition_output" node scripts/resolve-release-transition.mjs
          release_commit="$(grep '^release_commit=' "$transition_output" | cut -d= -f2)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves release commit ${release_commit}, but this run is on ${GITHUB_SHA}. Only the CI coordinator may trigger a release publish; do not push tags manually."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm run pack:check

      - name: Verify npm release order
        run: |
          registry_error="$(mktemp)"
          trap 'rm -f "$registry_error"' EXIT
          if ! latest_version="$(
            npm view "openclaw-weixin@latest" version \
              --registry=https://registry.npmjs.org 2>"$registry_error"
          )"; then
            cat "$registry_error" >&2
            echo "::error::Could not read the npm latest version."
            exit 1
          fi
          RELEASE_PREVIOUS_VERSION="$latest_version" npm run check:versions

      - name: Publish package with provenance
        run: npm publish --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org
