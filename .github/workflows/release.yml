name: Publish coordinated release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate coordinated release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      clawhub_published: ${{ steps.targets.outputs.clawhub_published }}
      npmjs_published: ${{ steps.targets.outputs.npmjs_published }}
      publication_required: ${{ steps.targets.outputs.publication_required }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify release metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a tag, not ${RELEASE_REF_TYPE} ${RELEASE_TAG}."
            exit 1
          fi
          npm run check:versions
          transition_output="$(mktemp)"
          trap 'rm -f "$transition_output"' EXIT
          GITHUB_OUTPUT="$transition_output" node scripts/resolve-release-transition.mjs
          release_commit="$(grep '^release_commit=' "$transition_output" | cut -d= -f2)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves release commit ${release_commit}, but this run is on ${GITHUB_SHA}. Only the CI coordinator may trigger a release publish; do not push tags manually."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Check project
        run: npm run check

      - name: Inspect package contents
        run: npm run pack:check

      - name: Build ClawPack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-package" "$RUNNER_TEMP/clawhub-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package" >/dev/null
          node scripts/prepare-clawhub-package.mjs \
            "$RUNNER_TEMP/npm-package" \
            "$RUNNER_TEMP/clawhub-package"

      - name: Validate and dry-run ClawHub publish
        run: |
          set -euo pipefail
          shopt -s nullglob
          clawpacks=("$RUNNER_TEMP/clawhub-package/"*.tgz)
          if (( ${#clawpacks[@]} != 1 )); then
            echo "::error::Expected exactly one ClawPack, found ${#clawpacks[@]}."
            exit 1
          fi
          clawpack="${clawpacks[0]}"
          openclaw_version="$(
            node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).openclaw.build.openclawVersion"
          )"
          package_root="$RUNNER_TEMP/clawhub-package-root"
          mkdir -p "$package_root"
          tar -xzf "$clawpack" -C "$package_root"
          npx --yes clawhub@0.23.3 package validate \
            "$package_root/package" \
            --out "$RUNNER_TEMP/clawhub-inspector" \
            --openclaw-version "$openclaw_version" \
            --json |
            tee "$RUNNER_TEMP/clawhub-validate.json"
          npx --yes clawhub@0.23.3 package publish "$clawpack" \
            --family code-plugin \
            --owner newfuture \
            --display-name WeChat \
            --categories channels \
            --topics wechat,weixin,messaging \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --dry-run \
            --json |
            tee "$RUNNER_TEMP/clawhub-dry-run.json"

      - name: Resolve registry publication targets
        id: targets
        env:
          RELEASE_TARGETS_REPORT: ${{ runner.temp }}/release-targets-before-approval.json
        run: node scripts/resolve-release-targets.mjs

      - name: Upload coordinated release preflight reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coordinated-release-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/clawhub-inspector
            ${{ runner.temp }}/clawhub-validate.json
            ${{ runner.temp }}/clawhub-dry-run.json
            ${{ runner.temp }}/release-targets-before-approval.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Approve and publish registries
    needs: validate
    if: needs.validate.outputs.publication_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/openclaw-weixin
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify release metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a tag, not ${RELEASE_REF_TYPE} ${RELEASE_TAG}."
            exit 1
          fi
          npm run check:versions
          transition_output="$(mktemp)"
          trap 'rm -f "$transition_output"' EXIT
          GITHUB_OUTPUT="$transition_output" node scripts/resolve-release-transition.mjs
          release_commit="$(grep '^release_commit=' "$transition_output" | cut -d= -f2)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves release commit ${release_commit}, but this run is on ${GITHUB_SHA}. Only the CI coordinator may trigger a release publish; do not push tags manually."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm run pack:check

      - name: Build ClawPack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-package" "$RUNNER_TEMP/clawhub-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package" >/dev/null
          node scripts/prepare-clawhub-package.mjs \
            "$RUNNER_TEMP/npm-package" \
            "$RUNNER_TEMP/clawhub-package"

      - name: Validate and dry-run ClawHub publish
        run: |
          set -euo pipefail
          shopt -s nullglob
          clawpacks=("$RUNNER_TEMP/clawhub-package/"*.tgz)
          if (( ${#clawpacks[@]} != 1 )); then
            echo "::error::Expected exactly one ClawPack, found ${#clawpacks[@]}."
            exit 1
          fi
          clawpack="${clawpacks[0]}"
          openclaw_version="$(
            node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).openclaw.build.openclawVersion"
          )"
          package_root="$RUNNER_TEMP/clawhub-package-root"
          mkdir -p "$package_root"
          tar -xzf "$clawpack" -C "$package_root"
          npx --yes clawhub@0.23.3 package validate \
            "$package_root/package" \
            --out "$RUNNER_TEMP/clawhub-inspector" \
            --openclaw-version "$openclaw_version" \
            --json |
            tee "$RUNNER_TEMP/clawhub-validate.json"
          npx --yes clawhub@0.23.3 package publish "$clawpack" \
            --family code-plugin \
            --owner newfuture \
            --display-name WeChat \
            --categories channels \
            --topics wechat,weixin,messaging \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --dry-run \
            --json |
            tee "$RUNNER_TEMP/clawhub-dry-run.json"

      - name: Recheck registry publication targets
        id: targets
        env:
          RELEASE_TARGETS_REPORT: ${{ runner.temp }}/release-targets-after-approval.json
        run: node scripts/resolve-release-targets.mjs

      - name: Verify live release tag before npmjs publication
        run: node scripts/verify-release-tag.mjs

      - name: Publish npm package with provenance
        if: steps.targets.outputs.npmjs_published != 'true'
        run: npm publish --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org

      - name: Verify npmjs publication
        run: |
          set -euo pipefail
          target_version="$(node -p "require('./package.json').version")"
          published_version="$(
            npm view "openclaw-weixin@${target_version}" version \
              --registry=https://registry.npmjs.org
          )"
          if [[ "$published_version" != "$target_version" ]]; then
            echo "::error::npm returned unexpected version ${published_version} for ${target_version}."
            exit 1
          fi

      - name: Verify live release tag before ClawHub publication
        run: node scripts/verify-release-tag.mjs

      - name: Check prior ClawHub publication boundary
        if: steps.targets.outputs.clawhub_published != 'true'
        id: clawhub-boundary
        env:
          CLAWHUB_BOUNDARY_CHECKS: ${{ runner.temp }}/clawhub-publication-boundary-checks.json
          CLAWHUB_BOUNDARY_MARKER: ${{ runner.temp }}/clawhub-publication-boundary.json
          CLAWHUB_BOUNDARY_REPORT: ${{ runner.temp }}/clawhub-publication-boundaries.json
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_version="$(node -p "require('./package.json').version")"
          boundary_name="clawhub-publication-boundary-v${target_version}-${GITHUB_SHA}"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="$boundary_name" \
            -f per_page=100 \
            > "$CLAWHUB_BOUNDARY_REPORT"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            -f check_name="$boundary_name" \
            -f filter=all \
            -f per_page=100 \
            > "$CLAWHUB_BOUNDARY_CHECKS"
          CLAWHUB_BOUNDARY_NAME="$boundary_name" \
            node scripts/prepare-clawhub-publication.mjs

      - name: Create durable ClawHub publication boundary
        if: steps.targets.outputs.clawhub_published != 'true'
        id: clawhub-boundary-check
        env:
          BOUNDARY_NAME: ${{ steps.clawhub-boundary.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name="$BOUNDARY_NAME" \
              -f head_sha="$GITHUB_SHA" \
              -f status=in_progress \
              -f started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              -f 'output[title]=ClawHub publication boundary active' \
              -f 'output[summary]=The exact ClawHub version must be verified before this boundary is cleared or retried.'
          )"
          check_run_id="$(jq -r '.id // empty' <<<"$response")"
          if [[ ! "$check_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::GitHub did not return the durable ClawHub boundary check-run ID."
            exit 1
          fi
          echo "id=$check_run_id" >> "$GITHUB_OUTPUT"

      - name: Persist ClawHub publication boundary
        if: steps.targets.outputs.clawhub_published != 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ steps.clawhub-boundary.outputs.name }}
          path: ${{ runner.temp }}/clawhub-publication-boundary.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish ClawPack
        if: steps.targets.outputs.clawhub_published != 'true'
        env:
          PUBLISH_RESULT: ${{ runner.temp }}/clawhub-package-publish.json
        run: |
          set -euo pipefail
          shopt -s nullglob
          clawpacks=("$RUNNER_TEMP/clawhub-package/"*.tgz)
          if (( ${#clawpacks[@]} != 1 )); then
            echo "::error::Expected exactly one ClawPack, found ${#clawpacks[@]}."
            exit 1
          fi
          npx --yes clawhub@0.23.3 package publish "${clawpacks[0]}" \
            --family code-plugin \
            --owner newfuture \
            --display-name WeChat \
            --categories channels \
            --topics wechat,weixin,messaging \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --wait \
            --wait-timeout 2400 \
            --json |
            tee "$PUBLISH_RESULT"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(process.env.PUBLISH_RESULT, "utf8"));
            if (result.publicationStatus !== "published") {
              throw new Error(
                `ClawHub publication did not complete: ${result.publicationStatus ?? "unknown"}`,
              );
            }
          '

      - name: Verify coordinated publication
        id: final-targets
        env:
          RELEASE_TARGETS_REPORT: ${{ runner.temp }}/release-targets-final.json
        run: node scripts/resolve-release-targets.mjs

      - name: Require both registry versions
        env:
          PUBLICATION_REQUIRED: ${{ steps.final-targets.outputs.publication_required }}
        run: |
          if [[ "$PUBLICATION_REQUIRED" != "false" ]]; then
            echo "::error::A coordinated registry target is still missing after publication."
            exit 1
          fi

      - name: Complete durable ClawHub publication boundary
        if: steps.targets.outputs.clawhub_published != 'true'
        env:
          CHECK_RUN_ID: ${{ steps.clawhub-boundary-check.outputs.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}" \
            -f status=completed \
            -f conclusion=success \
            -f completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -f 'output[title]=ClawHub publication verified' \
            -f 'output[summary]=The exact ClawHub version and source/runtime identity were verified.'

      - name: Upload coordinated publication reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coordinated-release-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/clawhub-inspector
            ${{ runner.temp }}/clawhub-validate.json
            ${{ runner.temp }}/clawhub-dry-run.json
            ${{ runner.temp }}/clawhub-publication-boundaries.json
            ${{ runner.temp }}/clawhub-publication-boundary-checks.json
            ${{ runner.temp }}/clawhub-publication-boundary.json
            ${{ runner.temp }}/clawhub-package-publish.json
            ${{ runner.temp }}/release-targets-after-approval.json
            ${{ runner.temp }}/release-targets-final.json
          if-no-files-found: ignore
          retention-days: 7

  github-package:
    name: Publish to GitHub Packages
    needs:
      - validate
      - publish
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_PACKAGE_NAME: "@newfuture/openclaw-weixin"
      GITHUB_PACKAGE_REGISTRY: https://npm.pkg.github.com

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"

      - name: Verify release metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a tag, not ${RELEASE_REF_TYPE} ${RELEASE_TAG}."
            exit 1
          fi
          npm run check:versions
          transition_output="$(mktemp)"
          trap 'rm -f "$transition_output"' EXIT
          GITHUB_OUTPUT="$transition_output" node scripts/resolve-release-transition.mjs
          previous_release_version="$(grep '^previous_release_version=' "$transition_output" | cut -d= -f2)"
          release_commit="$(grep '^release_commit=' "$transition_output" | cut -d= -f2)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves release commit ${release_commit}, but this run is on ${GITHUB_SHA}. Only the CI coordinator may trigger a release publish; do not push tags manually."
            exit 1
          fi
          echo "PREVIOUS_RELEASE_VERSION=${previous_release_version}" >> "$GITHUB_ENV"

      - name: Configure GitHub Packages lookup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          registry-url: https://npm.pkg.github.com
          scope: "@newfuture"

      - name: Check GitHub Packages release order
        id: github-status
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_version="$(node -p "require('./package.json').version")"
          registry_error="$(mktemp)"
          trap 'rm -f "$registry_error"' EXIT
          if published_version="$(
            npm view "${GITHUB_PACKAGE_NAME}@${target_version}" version \
              --registry="$GITHUB_PACKAGE_REGISTRY" 2>"$registry_error"
          )"; then
            if [[ "$published_version" != "$target_version" ]]; then
              echo "::error::GitHub Packages returned unexpected version ${published_version} for ${target_version}."
              exit 1
            fi
            echo "${GITHUB_PACKAGE_NAME}@${target_version} is already published."
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -Eq 'E404|404 Not Found' "$registry_error"; then
            cat "$registry_error" >&2
            echo "::error::Could not determine whether ${GITHUB_PACKAGE_NAME}@${target_version} is published."
            exit 1
          fi

          : > "$registry_error"
          if latest_version="$(
            npm view "${GITHUB_PACKAGE_NAME}@latest" version \
              --registry="$GITHUB_PACKAGE_REGISTRY" 2>"$registry_error"
          )"; then
            if [[ "$latest_version" != "$PREVIOUS_RELEASE_VERSION" ]]; then
              echo "::error::GitHub Packages latest is ${latest_version}, but the previous repository release is ${PREVIOUS_RELEASE_VERSION}."
              echo "::error::Publish or reconcile ${GITHUB_PACKAGE_NAME}@${PREVIOUS_RELEASE_VERSION} before ${target_version}."
              exit 1
            fi
            RELEASE_PREVIOUS_VERSION="$latest_version" npm run check:versions
          elif ! grep -Eq 'E404|404 Not Found' "$registry_error"; then
            cat "$registry_error" >&2
            echo "::error::Could not read the latest GitHub Packages version."
            exit 1
          else
            echo "::error::GitHub Packages is empty; publish ${GITHUB_PACKAGE_NAME}@${PREVIOUS_RELEASE_VERSION} before ${target_version}."
            exit 1
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for build
        if: steps.github-status.outputs.published != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.github-status.outputs.published != 'true'
        run: npm ci

      - name: Build package
        if: steps.github-status.outputs.published != 'true'
        run: npm run build

      - name: Inspect package contents
        if: steps.github-status.outputs.published != 'true'
        run: npm run pack:check

      - name: Prepare GitHub Packages artifact
        if: steps.github-status.outputs.published != 'true'
        run: |
          set -euo pipefail
          package_tarball="$(
            npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json |
              node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename"
          )"
          package_root="$RUNNER_TEMP/github-package"
          mkdir -p "$package_root"
          tar -xzf "$RUNNER_TEMP/$package_tarball" -C "$package_root"
          node scripts/prepare-github-package.mjs "$package_root/package"
          (
            cd "$package_root/package"
            npm pack --dry-run --ignore-scripts --json >/dev/null
          )

      - name: Configure GitHub Packages registry
        if: steps.github-status.outputs.published != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          registry-url: https://npm.pkg.github.com
          scope: "@newfuture"

      - name: Verify live release tag before GitHub Packages publication
        if: steps.github-status.outputs.published != 'true'
        run: node scripts/verify-release-tag.mjs

      - name: Publish GitHub package
        if: steps.github-status.outputs.published != 'true'
        working-directory: ${{ runner.temp }}/github-package/package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish --ignore-scripts --registry=https://npm.pkg.github.com

  github-release:
    name: Publish GitHub release
    needs:
      - validate
      - publish
      - github-package
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
        && needs.github-package.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"

      - name: Render bilingual release notes
        run: node scripts/render-release-notes.mjs > "$RUNNER_TEMP/release-notes.md"

      - name: Verify live release tag before GitHub Release publication
        run: node scripts/verify-release-tag.mjs

      - name: Create or finalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_error="$(mktemp)"
          trap 'rm -f "$release_error"' EXIT
          if release_state="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq '[.draft, .prerelease, .html_url] | @tsv' 2>"$release_error"
          )"; then
            IFS=$'\t' read -r is_draft is_prerelease release_url <<< "$release_state"
            if [[ "$is_draft" == "false" && "$is_prerelease" == "false" ]]; then
              echo "${RELEASE_TAG} is already published at ${release_url}."
              exit 0
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease=false \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES"
            exit 0
          fi
          if ! grep -q 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            echo "::error::Could not determine whether GitHub Release ${RELEASE_TAG} exists."
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES"
