name: Publish coordinated release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate coordinated release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      npmjs_published: ${{ steps.npmjs-status.outputs.published }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify release metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a tag, not ${RELEASE_REF_TYPE} ${RELEASE_TAG}."
            exit 1
          fi
          npm run check:versions
          transition_output="$(mktemp)"
          trap 'rm -f "$transition_output"' EXIT
          GITHUB_OUTPUT="$transition_output" node scripts/resolve-release-transition.mjs
          release_commit="$(grep '^release_commit=' "$transition_output" | cut -d= -f2)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves release commit ${release_commit}, but this run is on ${GITHUB_SHA}. Only the CI coordinator may trigger a release publish; do not push tags manually."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Check project
        run: npm run check

      - name: Inspect package contents
        run: npm run pack:check

      - name: Verify npmjs release order
        id: npmjs-status
        run: |
          set -euo pipefail
          target_version="$(node -p "require('./package.json').version")"
          registry_error="$(mktemp)"
          trap 'rm -f "$registry_error"' EXIT
          if published_version="$(
            npm view "openclaw-weixin@${target_version}" version \
              --registry=https://registry.npmjs.org 2>"$registry_error"
          )"; then
            if [[ "$published_version" != "$target_version" ]]; then
              echo "::error::npm returned unexpected version ${published_version} for ${target_version}."
              exit 1
            fi
            echo "openclaw-weixin@${target_version} is already published; npm publication will be skipped."
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -Eq 'E404|404 Not Found' "$registry_error"; then
            cat "$registry_error" >&2
            echo "::error::Could not determine whether openclaw-weixin@${target_version} is published."
            exit 1
          fi

          : > "$registry_error"
          if ! latest_version="$(
            npm view "openclaw-weixin@latest" version \
              --registry=https://registry.npmjs.org 2>"$registry_error"
          )"; then
            cat "$registry_error" >&2
            echo "::error::Could not read the npm latest version."
            exit 1
          fi
          RELEASE_PREVIOUS_VERSION="$latest_version" npm run check:versions
          echo "published=false" >> "$GITHUB_OUTPUT"

  publish:
    name: Approve and publish to npmjs
    needs: validate
    if: needs.validate.outputs.npmjs_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/openclaw-weixin
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify release metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a tag, not ${RELEASE_REF_TYPE} ${RELEASE_TAG}."
            exit 1
          fi
          npm run check:versions
          transition_output="$(mktemp)"
          trap 'rm -f "$transition_output"' EXIT
          GITHUB_OUTPUT="$transition_output" node scripts/resolve-release-transition.mjs
          release_commit="$(grep '^release_commit=' "$transition_output" | cut -d= -f2)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves release commit ${release_commit}, but this run is on ${GITHUB_SHA}. Only the CI coordinator may trigger a release publish; do not push tags manually."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm run pack:check

      - name: Verify npmjs release order
        id: npmjs-status
        run: |
          set -euo pipefail
          target_version="$(node -p "require('./package.json').version")"
          registry_error="$(mktemp)"
          trap 'rm -f "$registry_error"' EXIT
          if published_version="$(
            npm view "openclaw-weixin@${target_version}" version \
              --registry=https://registry.npmjs.org 2>"$registry_error"
          )"; then
            if [[ "$published_version" != "$target_version" ]]; then
              echo "::error::npm returned unexpected version ${published_version} for ${target_version}."
              exit 1
            fi
            echo "openclaw-weixin@${target_version} was published while this run waited for approval."
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -Eq 'E404|404 Not Found' "$registry_error"; then
            cat "$registry_error" >&2
            echo "::error::Could not determine whether openclaw-weixin@${target_version} is published."
            exit 1
          fi

          : > "$registry_error"
          if ! latest_version="$(
            npm view "openclaw-weixin@latest" version \
              --registry=https://registry.npmjs.org 2>"$registry_error"
          )"; then
            cat "$registry_error" >&2
            echo "::error::Could not read the npm latest version."
            exit 1
          fi
          RELEASE_PREVIOUS_VERSION="$latest_version" npm run check:versions
          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Publish package with provenance
        if: steps.npmjs-status.outputs.published != 'true'
        run: npm publish --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org

  github-package:
    name: Publish to GitHub Packages
    needs:
      - validate
      - publish
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_PACKAGE_NAME: "@newfuture/openclaw-weixin"
      GITHUB_PACKAGE_REGISTRY: https://npm.pkg.github.com

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"

      - name: Verify release metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a tag, not ${RELEASE_REF_TYPE} ${RELEASE_TAG}."
            exit 1
          fi
          npm run check:versions
          transition_output="$(mktemp)"
          trap 'rm -f "$transition_output"' EXIT
          GITHUB_OUTPUT="$transition_output" node scripts/resolve-release-transition.mjs
          previous_release_version="$(grep '^previous_release_version=' "$transition_output" | cut -d= -f2)"
          release_commit="$(grep '^release_commit=' "$transition_output" | cut -d= -f2)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves release commit ${release_commit}, but this run is on ${GITHUB_SHA}. Only the CI coordinator may trigger a release publish; do not push tags manually."
            exit 1
          fi
          echo "PREVIOUS_RELEASE_VERSION=${previous_release_version}" >> "$GITHUB_ENV"

      - name: Configure GitHub Packages lookup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          registry-url: https://npm.pkg.github.com
          scope: "@newfuture"

      - name: Check GitHub Packages release order
        id: github-status
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_version="$(node -p "require('./package.json').version")"
          registry_error="$(mktemp)"
          trap 'rm -f "$registry_error"' EXIT
          if published_version="$(
            npm view "${GITHUB_PACKAGE_NAME}@${target_version}" version \
              --registry="$GITHUB_PACKAGE_REGISTRY" 2>"$registry_error"
          )"; then
            if [[ "$published_version" != "$target_version" ]]; then
              echo "::error::GitHub Packages returned unexpected version ${published_version} for ${target_version}."
              exit 1
            fi
            echo "${GITHUB_PACKAGE_NAME}@${target_version} is already published."
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -Eq 'E404|404 Not Found' "$registry_error"; then
            cat "$registry_error" >&2
            echo "::error::Could not determine whether ${GITHUB_PACKAGE_NAME}@${target_version} is published."
            exit 1
          fi

          : > "$registry_error"
          if latest_version="$(
            npm view "${GITHUB_PACKAGE_NAME}@latest" version \
              --registry="$GITHUB_PACKAGE_REGISTRY" 2>"$registry_error"
          )"; then
            if [[ "$latest_version" != "$PREVIOUS_RELEASE_VERSION" ]]; then
              echo "::error::GitHub Packages latest is ${latest_version}, but the previous repository release is ${PREVIOUS_RELEASE_VERSION}."
              echo "::error::Publish or reconcile ${GITHUB_PACKAGE_NAME}@${PREVIOUS_RELEASE_VERSION} before ${target_version}."
              exit 1
            fi
            RELEASE_PREVIOUS_VERSION="$latest_version" npm run check:versions
          elif ! grep -Eq 'E404|404 Not Found' "$registry_error"; then
            cat "$registry_error" >&2
            echo "::error::Could not read the latest GitHub Packages version."
            exit 1
          else
            echo "${GITHUB_PACKAGE_NAME} has no existing GitHub Packages versions."
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for build
        if: steps.github-status.outputs.published != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.github-status.outputs.published != 'true'
        run: npm ci

      - name: Build package
        if: steps.github-status.outputs.published != 'true'
        run: npm run build

      - name: Inspect package contents
        if: steps.github-status.outputs.published != 'true'
        run: npm run pack:check

      - name: Prepare GitHub Packages artifact
        if: steps.github-status.outputs.published != 'true'
        run: |
          set -euo pipefail
          package_tarball="$(
            npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json |
              node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename"
          )"
          package_root="$RUNNER_TEMP/github-package"
          mkdir -p "$package_root"
          tar -xzf "$RUNNER_TEMP/$package_tarball" -C "$package_root"
          node scripts/prepare-github-package.mjs "$package_root/package"
          (
            cd "$package_root/package"
            npm pack --dry-run --ignore-scripts --json >/dev/null
          )

      - name: Configure GitHub Packages registry
        if: steps.github-status.outputs.published != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          registry-url: https://npm.pkg.github.com
          scope: "@newfuture"

      - name: Publish GitHub package
        if: steps.github-status.outputs.published != 'true'
        working-directory: ${{ runner.temp }}/github-package/package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish --ignore-scripts --registry=https://npm.pkg.github.com

  github-release:
    name: Publish GitHub release
    needs:
      - validate
      - publish
      - github-package
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
        && needs.github-package.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"

      - name: Render bilingual release notes
        run: node scripts/render-release-notes.mjs > "$RUNNER_TEMP/release-notes.md"

      - name: Create or finalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_error="$(mktemp)"
          trap 'rm -f "$release_error"' EXIT
          if release_state="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq '[.draft, .prerelease, .html_url] | @tsv' 2>"$release_error"
          )"; then
            IFS=$'\t' read -r is_draft is_prerelease release_url <<< "$release_state"
            if [[ "$is_draft" == "false" && "$is_prerelease" == "false" ]]; then
              echo "${RELEASE_TAG} is already published at ${release_url}."
              exit 0
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease=false \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES"
            exit 0
          fi
          if ! grep -q 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            echo "::error::Could not determine whether GitHub Release ${RELEASE_TAG} exists."
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES"
