name: Publish coordinated release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      authorize_clawhub_recovery:
        description: Authorize a new ClawHub attempt after authoritative review of an older partial release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate coordinated release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      clawhub_published: ${{ steps.targets.outputs.clawhub_published }}
      npmjs_published: ${{ steps.targets.outputs.npmjs_published }}
      publication_required: ${{ steps.targets.outputs.publication_required }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify release metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a tag, not ${RELEASE_REF_TYPE} ${RELEASE_TAG}."
            exit 1
          fi
          npm run check:versions
          transition_output="$(mktemp)"
          trap 'rm -f "$transition_output"' EXIT
          GITHUB_OUTPUT="$transition_output" node scripts/resolve-release-transition.mjs
          release_commit="$(grep '^release_commit=' "$transition_output" | cut -d= -f2)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves release commit ${release_commit}, but this run is on ${GITHUB_SHA}. Only the CI coordinator may trigger a release publish; do not push tags manually."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Check project
        run: npm run check

      - name: Inspect package contents
        run: npm run pack:check

      - name: Build ClawPack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-package" "$RUNNER_TEMP/clawhub-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package" >/dev/null
          node scripts/prepare-clawhub-package.mjs \
            "$RUNNER_TEMP/npm-package" \
            "$RUNNER_TEMP/clawhub-package"

      - name: Validate and dry-run ClawHub publish
        run: |
          set -euo pipefail
          shopt -s nullglob
          clawpacks=("$RUNNER_TEMP/clawhub-package/"*.tgz)
          if (( ${#clawpacks[@]} != 1 )); then
            echo "::error::Expected exactly one ClawPack, found ${#clawpacks[@]}."
            exit 1
          fi
          clawpack="${clawpacks[0]}"
          openclaw_version="$(
            node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).openclaw.build.openclawVersion"
          )"
          package_root="$RUNNER_TEMP/clawhub-package-root"
          mkdir -p "$package_root"
          tar -xzf "$clawpack" -C "$package_root"
          npx --yes clawhub@0.23.3 package validate \
            "$package_root/package" \
            --out "$RUNNER_TEMP/clawhub-inspector" \
            --openclaw-version "$openclaw_version" \
            --json |
            tee "$RUNNER_TEMP/clawhub-validate.json"
          npx --yes clawhub@0.23.3 package publish "$clawpack" \
            --family code-plugin \
            --owner newfuture \
            --display-name WeChat \
            --categories channels \
            --topics wechat,weixin,messaging \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --dry-run \
            --json |
            tee "$RUNNER_TEMP/clawhub-dry-run.json"

      - name: Resolve registry publication targets
        id: targets
        env:
          RELEASE_TARGETS_REPORT: ${{ runner.temp }}/release-targets-before-approval.json
        run: node scripts/resolve-release-targets.mjs

      - name: Upload coordinated release preflight reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coordinated-release-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/clawhub-inspector
            ${{ runner.temp }}/clawhub-validate.json
            ${{ runner.temp }}/clawhub-dry-run.json
            ${{ runner.temp }}/release-targets-before-approval.json
          if-no-files-found: ignore
          retention-days: 7

  npm-publish:
    name: Approve and publish npmjs
    needs: validate
    if: needs.validate.outputs.npmjs_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/openclaw-weixin
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify release metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a tag, not ${RELEASE_REF_TYPE} ${RELEASE_TAG}."
            exit 1
          fi
          npm run check:versions
          transition_output="$(mktemp)"
          trap 'rm -f "$transition_output"' EXIT
          GITHUB_OUTPUT="$transition_output" node scripts/resolve-release-transition.mjs
          release_commit="$(grep '^release_commit=' "$transition_output" | cut -d= -f2)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves release commit ${release_commit}, but this run is on ${GITHUB_SHA}. Only the CI coordinator may trigger a release publish; do not push tags manually."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm run pack:check

      - name: Verify live release tag before npmjs publication
        run: node scripts/verify-release-tag.mjs

      - name: Recheck npmjs publication target
        id: targets
        env:
          RELEASE_TARGETS_REPORT: ${{ runner.temp }}/npmjs-target-after-approval.json
          RELEASE_TARGETS_SCOPE: npmjs
        run: node scripts/resolve-release-targets.mjs

      - name: Publish npm package with provenance
        if: steps.targets.outputs.npmjs_published != 'true'
        run: npm publish --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org

      - name: Upload npmjs publication reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npmjs-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npmjs-target-after-approval.json
          if-no-files-found: ignore
          retention-days: 30

  clawhub-publish:
    name: Approve and publish ClawHub
    needs: validate
    if: needs.validate.outputs.clawhub_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: clawhub-publish
      url: https://clawhub.ai/packages/openclaw-wechat
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify release metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a tag, not ${RELEASE_REF_TYPE} ${RELEASE_TAG}."
            exit 1
          fi
          npm run check:versions
          transition_output="$(mktemp)"
          trap 'rm -f "$transition_output"' EXIT
          GITHUB_OUTPUT="$transition_output" node scripts/resolve-release-transition.mjs
          release_commit="$(grep '^release_commit=' "$transition_output" | cut -d= -f2)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves release commit ${release_commit}, but this run is on ${GITHUB_SHA}. Only the CI coordinator may trigger a release publish; do not push tags manually."
            exit 1
          fi

      - name: Verify live release tag after approval
        run: node scripts/verify-release-tag.mjs

      - name: Recheck exact ClawHub publication target
        id: targets
        env:
          RELEASE_TARGETS_REPORT: ${{ runner.temp }}/clawhub-target-after-approval.json
          RELEASE_TARGETS_SCOPE: clawhub
        run: node scripts/resolve-release-targets.mjs

      - name: Install dependencies
        if: steps.targets.outputs.clawhub_published != 'true'
        run: npm ci

      - name: Build package
        if: steps.targets.outputs.clawhub_published != 'true'
        run: npm run build

      - name: Inspect package contents
        if: steps.targets.outputs.clawhub_published != 'true'
        run: npm run pack:check

      - name: Build ClawPack
        if: steps.targets.outputs.clawhub_published != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-package" "$RUNNER_TEMP/clawhub-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package" >/dev/null
          node scripts/prepare-clawhub-package.mjs \
            "$RUNNER_TEMP/npm-package" \
            "$RUNNER_TEMP/clawhub-package"

      - name: Validate and dry-run ClawHub publish
        if: steps.targets.outputs.clawhub_published != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          clawpacks=("$RUNNER_TEMP/clawhub-package/"*.tgz)
          if (( ${#clawpacks[@]} != 1 )); then
            echo "::error::Expected exactly one ClawPack, found ${#clawpacks[@]}."
            exit 1
          fi
          clawpack="${clawpacks[0]}"
          openclaw_version="$(
            node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).openclaw.build.openclawVersion"
          )"
          package_root="$RUNNER_TEMP/clawhub-package-root"
          mkdir -p "$package_root"
          tar -xzf "$clawpack" -C "$package_root"
          npx --yes clawhub@0.23.3 package validate \
            "$package_root/package" \
            --out "$RUNNER_TEMP/clawhub-inspector" \
            --openclaw-version "$openclaw_version" \
            --json |
            tee "$RUNNER_TEMP/clawhub-validate.json"
          npx --yes clawhub@0.23.3 package publish "$clawpack" \
            --family code-plugin \
            --owner newfuture \
            --display-name WeChat \
            --categories channels \
            --topics wechat,weixin,messaging \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --dry-run \
            --json |
            tee "$RUNNER_TEMP/clawhub-dry-run.json"

      - name: Recheck ClawHub target before publication
        if: steps.targets.outputs.clawhub_published != 'true'
        id: ready-target
        env:
          RELEASE_TARGETS_REPORT: ${{ runner.temp }}/clawhub-target-before-boundary.json
          RELEASE_TARGETS_SCOPE: clawhub
        run: node scripts/resolve-release-targets.mjs

      - name: Verify live release tag before ClawHub publication
        if: >-
          ${{
            steps.targets.outputs.clawhub_published != 'true'
            && steps.ready-target.outputs.clawhub_published != 'true'
          }}
        run: node scripts/verify-release-tag.mjs

      - name: Check prior ClawHub publication boundary
        if: >-
          ${{
            steps.targets.outputs.clawhub_published != 'true'
            && steps.ready-target.outputs.clawhub_published != 'true'
          }}
        id: clawhub-boundary
        env:
          CLAWHUB_BOUNDARY_CHECK_REPORT: ${{ runner.temp }}/clawhub-publication-checks.json
          CLAWHUB_BOUNDARY_CHECK_REQUEST: ${{ runner.temp }}/clawhub-publication-check-request.json
          CLAWHUB_BOUNDARY_MARKER: ${{ runner.temp }}/clawhub-publication-boundary.json
          CLAWHUB_BOUNDARY_REPORT: ${{ runner.temp }}/clawhub-publication-boundaries.json
          CLAWHUB_RECOVERY_AUTHORIZED: ${{ inputs.authorize_clawhub_recovery || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_version="$(node -p "require('./package.json').version")"
          boundary_name="clawhub-publication-boundary-v${target_version}-${GITHUB_SHA}"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="$boundary_name" \
            -f per_page=100 \
            > "$CLAWHUB_BOUNDARY_REPORT"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            -f check_name="$boundary_name" \
            -f filter=all \
            -f per_page=100 \
            > "$CLAWHUB_BOUNDARY_CHECK_REPORT"
          CLAWHUB_BOUNDARY_NAME="$boundary_name" \
            node scripts/prepare-clawhub-publication.mjs

      - name: Persist durable ClawHub publication check
        if: >-
          ${{
            steps.targets.outputs.clawhub_published != 'true'
            && steps.ready-target.outputs.clawhub_published != 'true'
          }}
        env:
          CHECK_REQUEST: ${{ runner.temp }}/clawhub-publication-check-request.json
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input "$CHECK_REQUEST"

      - name: Persist ClawHub publication boundary artifact
        if: >-
          ${{
            steps.targets.outputs.clawhub_published != 'true'
            && steps.ready-target.outputs.clawhub_published != 'true'
          }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ steps.clawhub-boundary.outputs.name }}
          path: ${{ runner.temp }}/clawhub-publication-boundary.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish ClawPack
        if: >-
          ${{
            steps.targets.outputs.clawhub_published != 'true'
            && steps.ready-target.outputs.clawhub_published != 'true'
          }}
        env:
          PUBLISH_RESULT: ${{ runner.temp }}/clawhub-package-publish.json
        run: |
          set -euo pipefail
          shopt -s nullglob
          clawpacks=("$RUNNER_TEMP/clawhub-package/"*.tgz)
          if (( ${#clawpacks[@]} != 1 )); then
            echo "::error::Expected exactly one ClawPack, found ${#clawpacks[@]}."
            exit 1
          fi
          npx --yes clawhub@0.23.3 package publish "${clawpacks[0]}" \
            --family code-plugin \
            --display-name WeChat \
            --categories channels \
            --topics wechat,weixin,messaging \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --wait \
            --wait-timeout 2400 \
            --json |
            tee "$PUBLISH_RESULT"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(process.env.PUBLISH_RESULT, "utf8"));
            if (result.publicationStatus !== "published") {
              throw new Error(
                `ClawHub publication did not complete: ${result.publicationStatus ?? "unknown"}`,
              );
            }
          '

      - name: Upload ClawHub publication reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: clawhub-release-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/clawhub-inspector
            ${{ runner.temp }}/clawhub-validate.json
            ${{ runner.temp }}/clawhub-dry-run.json
            ${{ runner.temp }}/clawhub-publication-boundaries.json
            ${{ runner.temp }}/clawhub-publication-checks.json
            ${{ runner.temp }}/clawhub-publication-boundary.json
            ${{ runner.temp }}/clawhub-package-publish.json
            ${{ runner.temp }}/clawhub-target-after-approval.json
            ${{ runner.temp }}/clawhub-target-before-boundary.json
          if-no-files-found: ignore
          retention-days: 30

  github-package:
    name: Publish to GitHub Packages
    needs: validate
    if: >-
      ${{
        !cancelled()
        && needs.validate.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"

      - name: Verify release metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a tag, not ${RELEASE_REF_TYPE} ${RELEASE_TAG}."
            exit 1
          fi
          npm run check:versions
          transition_output="$(mktemp)"
          trap 'rm -f "$transition_output"' EXIT
          GITHUB_OUTPUT="$transition_output" node scripts/resolve-release-transition.mjs
          release_commit="$(grep '^release_commit=' "$transition_output" | cut -d= -f2)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves release commit ${release_commit}, but this run is on ${GITHUB_SHA}. Only the CI coordinator may trigger a release publish; do not push tags manually."
            exit 1
          fi

      - name: Configure GitHub Packages lookup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          registry-url: https://npm.pkg.github.com
          scope: "@newfuture"

      - name: Check exact GitHub Packages target
        id: github-status
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: node scripts/check-github-package-target.mjs

      - name: Set up Node.js for build
        if: steps.github-status.outputs.published != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.github-status.outputs.published != 'true'
        run: npm ci

      - name: Build package
        if: steps.github-status.outputs.published != 'true'
        run: npm run build

      - name: Inspect package contents
        if: steps.github-status.outputs.published != 'true'
        run: npm run pack:check

      - name: Prepare GitHub Packages artifact
        if: steps.github-status.outputs.published != 'true'
        run: |
          set -euo pipefail
          package_tarball="$(
            npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json |
              node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename"
          )"
          package_root="$RUNNER_TEMP/github-package"
          mkdir -p "$package_root"
          tar -xzf "$RUNNER_TEMP/$package_tarball" -C "$package_root"
          node scripts/prepare-github-package.mjs "$package_root/package"
          (
            cd "$package_root/package"
            npm pack --dry-run --ignore-scripts --json >/dev/null
          )

      - name: Configure GitHub Packages registry
        if: steps.github-status.outputs.published != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          registry-url: https://npm.pkg.github.com
          scope: "@newfuture"

      - name: Verify live release tag before GitHub Packages publication
        if: steps.github-status.outputs.published != 'true'
        run: node scripts/verify-release-tag.mjs

      - name: Recheck exact GitHub Packages target
        id: github-final-status
        if: steps.github-status.outputs.published != 'true'
        env:
          GITHUB_PACKAGE_EXACT_ONLY: "true"
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: node scripts/check-github-package-target.mjs

      - name: Publish GitHub package
        if: >-
          ${{
            steps.github-status.outputs.published != 'true'
            && steps.github-final-status.outputs.published != 'true'
          }}
        working-directory: ${{ runner.temp }}/github-package/package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish --ignore-scripts --registry=https://npm.pkg.github.com

  github-release:
    name: Publish GitHub release
    needs:
      - validate
      - npm-publish
      - clawhub-publish
      - github-package
    if: >-
      ${{
        !cancelled()
        && needs.validate.result == 'success'
        && (needs.npm-publish.result == 'success' || needs.npm-publish.result == 'skipped')
        && (needs.clawhub-publish.result == 'success' || needs.clawhub-publish.result == 'skipped')
        && needs.github-package.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"

      - name: Render bilingual release notes
        run: node scripts/render-release-notes.mjs > "$RUNNER_TEMP/release-notes.md"

      - name: Verify live release tag before GitHub Release publication
        run: node scripts/verify-release-tag.mjs

      - name: Create or finalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_error="$(mktemp)"
          trap 'rm -f "$release_error"' EXIT
          if release_state="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq '[.draft, .prerelease, .html_url] | @tsv' 2>"$release_error"
          )"; then
            IFS=$'\t' read -r is_draft is_prerelease release_url <<< "$release_state"
            if [[ "$is_draft" == "false" && "$is_prerelease" == "false" ]]; then
              echo "${RELEASE_TAG} is already published at ${release_url}."
              exit 0
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease=false \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES"
            exit 0
          fi
          if ! grep -q 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            echo "::error::Could not determine whether GitHub Release ${RELEASE_TAG} exists."
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES"
